<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 주문 키오스크</title>
    <style>
        :root { --primary-color: #e67e22; --secondary-color: #2c3e50; --bg-color: #f8f9fa; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; background-color: var(--bg-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background-color: var(--secondary-color); color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; flex-shrink: 0; }
        .menu-container { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; overflow-y: auto; padding-bottom: 250px; }
        .menu-item { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #eee; display: flex; flex-direction: column; height: auto; min-height: 240px; }
        .menu-item:active { transform: scale(0.98); transition: 0.1s; }
        .menu-img { width: 100%; height: 120px; object-fit: contain; background-color: white; padding: 10px; box-sizing: border-box; flex-shrink: 0; }
        .menu-info { padding: 12px 12px 15px 12px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .menu-info h3 { margin: 0 0 8px 0; font-size: 0.9rem; font-weight: 700; color: #333; line-height: 1.3; }
        .menu-info p { color: var(--primary-color); font-weight: 800; margin: 0 0 10px 0; font-size: 1rem; }
        .add-btn { background: #fff5eb; color: var(--primary-color); border: 1px solid var(--primary-color); padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; margin-top: auto; cursor: pointer; }
        .footer-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; box-shadow: 0 -4px 20px rgba(0,0,0,0.15); padding: 15px; box-sizing: border-box; z-index: 90; border-top-left-radius: 20px; border-top-right-radius: 20px; }
        #cart-list-container { max-height: 150px; overflow-y: auto; margin-bottom: 15px; border-bottom: 1px solid #eee; display: none; }
        .cart-item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #eee; font-size: 0.9rem; }
        .cart-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .order-btn { width: 100%; background: var(--primary-color); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .delete-btn { background: #fff; border: 1px solid #ff4757; color: #ff4757; border-radius: 5px; cursor: pointer;}
        
        /* 모달 공통 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 400px; text-align: center; }
        .user-input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        .save-user-btn { width: 100%; padding: 12px; background: var(--secondary-color); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; margin-top: 15px; cursor: pointer; }
        
        /* 완료 팝업 스타일 */
        #successModal .modal-content { border: 2px solid var(--primary-color); padding: 30px 20px; }
        .success-title { color: var(--primary-color); font-size: 1.4rem; margin-bottom: 10px; }
        .order-info-box { background: #f1f2f6; padding: 15px; border-radius: 8px; margin: 15px 0; }
        .order-label { font-size: 0.8rem; color: #666; margin-bottom: 4px; display: block; }
        .order-val { font-size: 1.1rem; font-weight: bold; color: #333; word-break: break-all; }
        .reception-val { font-size: 2rem; font-weight: 900; color: #e67e22; margin-top: 5px; }
        .waiting-msg { font-size: 1rem; color: #333; line-height: 1.5; margin-bottom: 20px; font-weight: bold; }

        /* ✨ [New] 로딩 오버레이 스타일 */
        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); /* 반투명 검정 배경 */
            z-index: 9999; /* 최상단 */
            display: none; /* 기본 숨김 */
            flex-direction: column; justify-content: center; align-items: center;
            color: white; font-weight: bold; font-size: 1.2rem;
            backdrop-filter: blur(3px); /* 배경 흐림 효과 추가 */
        }
        
        /* 로딩 스피너 애니메이션 */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <span>주문 확인 중...</span>
</div>

<header>🍴 프리미엄 스마트 오더</header>
<div class="menu-container" id="menu-grid"></div>

<div class="footer-nav">
    <div id="cart-list-container"></div>
    <div class="cart-info">
        <span id="cart-count" style="font-weight: bold;">선택: 0개</span>
        <span id="cart-total" style="color: var(--primary-color); font-weight: 800; font-size: 1.1rem;">0원</span>
    </div>
    <button class="order-btn" onclick="openModal()">주문 전송하기</button>
</div>

<div class="modal" id="userInfoModal" style="z-index: 2000;">
    <div class="modal-content">
        <h2 style="margin-top: 0;">환영합니다! 👋</h2>
        <p style="color:#666; font-size:0.9rem; margin-bottom:20px;">원활한 주문을 위해 정보를 입력해 주세요.</p>
        <input type="text" id="userNameInput" class="user-input" placeholder="이름">
        <input type="tel" id="userPhoneInput" class="user-input" placeholder="휴대폰 번호">
        <button class="save-user-btn" onclick="saveUserInfo()">입력 완료</button>
    </div>
</div>

<div class="modal" id="orderModal">
    <div class="modal-content">
        <h3 style="margin-top: 0;">주문하시겠습니까?</h3>
        <div id="order-details" style="text-align:left; background:#f9f9f9; padding:15px; border-radius:10px; margin:15px 0; max-height:200px; overflow-y:auto;"></div>
        <div style="display:flex; gap:10px;">
            <button style="flex:1; padding:12px; border:none; border-radius:10px; background:#eee;" onclick="closeModal()">취소</button>
            <button id="submit-btn" style="flex:1; padding:12px; border:none; border-radius:10px; background:var(--primary-color); color:white; font-weight:bold;" onclick="sendToSheet()">확인</button>
        </div>
    </div>
</div>

<div class="modal" id="successModal" style="z-index: 3000;">
    <div class="modal-content">
        <h2 class="success-title" id="statusTitle">✅ 주문 접수중</h2>
        
        <div class="order-info-box">
            <span class="order-label">주문번호</span>
            <div class="order-val" id="displayOrderId"></div>
            
            <div id="receptionArea" style="display:none; margin-top:15px; border-top:1px dashed #ccc; padding-top:10px;">
                <span class="order-label">접수번호</span>
                <div class="reception-val" id="displayReceptionNo"></div>
            </div>
        </div>

        <p class="waiting-msg" id="statusMsg">
            주문이 접수되었습니다.<br>접수번호가 나올 때까지 잠시만 기다려주세요.<br>
            <span style="font-size:0.8rem; color:#999; font-weight:normal;">(5초마다 자동으로 확인합니다)</span>
        </p>
        <button class="save-user-btn" onclick="closeSuccessModal()">창 닫기 (추가 주문)</button>
    </div>
</div>

<script>
    // ⚠️ 수정된 GAS 배포 URL을 입력하세요!
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxLdJiSGGUbKnRpvRjz7X7RBW-h0GFeVFZ5QkgsQZk6m1L0qAfJwU8jAkk2s3MPPFY5aQ/exec";

    const unifiedImage = "https://www.nordicnest.kr/assets/blobs/lyngby-porceln-23-cm/33618-03-01-2902fdeb01.jpg";
    const menuData = [
        { name: "한우소고기미역국", price: 17000, img: "./img/hansomi.png" },
        { name: "사골김치찌개", price: 17000, img: "./img/munggim.png" },
        { name: "통등심 로스카츠", price: 19000, img: "./img/tongkas.png" },
        { name: "순살 닭다리 구이덮밥", price: 18000, img: "./img/dakdup.png" },
        { name: "우삼겹덮밥", price: 18000, img: "./img/woodup.png" },
        { name: "치즈양념순살치킨", price: 28000, img: "./img/chichi.png" },
        { name: "후라이드치킨", price: 27000, img: "./img/fuchi.png" },
        { name: "야채튀김미역우동", price: 12000, img: "./img/yawoo.png" },
        { name: "얼큰마라우동", price: 12000, img: "./img/mawoo.png" },
        { name: "공깃밥", price: 1500, img: "./img/gong.png" },
        { name: "까르보나라 파스타", price: 13000, img: "./img/carbo.png" },
        { name: "미트 치즈 파스타", price: 13000, img: "./img/michipa.png" },
        { name: "페퍼로니 피자", price: 18000, img: "./img/ppza.png" },
        { name: "베이컨 포테이토 피자", price: 18000, img: "./img/bapopi.png" },
        { name: "미트 치즈 피자", price: 18000, img: "./img/michipi.png" },
        { name: "마라 떡볶이", price: 12000, img: "./img/matok.png" },
        { name: "로제 떡볶이", price: 12000, img: "./img/rotok.png" },
        { name: "찰순대", price: 10000, img: "./img/chalsun.png" },
        { name: "꼬치어묵", price: 5000, img: "./img/comuk.png" }
    ];

    let cart = [];
    let currentUser = { name: "", phone: "" };
    let pollingInterval = null;

    const grid = document.getElementById('menu-grid');
    menuData.forEach(item => {
        grid.innerHTML += `
            <div class="menu-item" onclick="addToCart('${item.name}', ${item.price})">
                <img src="${item.img}" class="menu-img" alt="${item.name}">
                <div class="menu-info">
                    <h3>${item.name}</h3>
                    <p>${item.price.toLocaleString()}원</p>
                    <button class="add-btn">담기</button>
                </div>
            </div>`;
    });

    function saveUserInfo() {
        const name = document.getElementById('userNameInput').value.trim();
        const phone = document.getElementById('userPhoneInput').value.trim();
        if (!name || !phone) return alert("정보를 입력해 주세요.");
        setCookie("kiosk_username", name, 30*24); 
        setCookie("kiosk_phone", phone, 30*24);
        currentUser.name = name; currentUser.phone = phone;
        document.getElementById('userInfoModal').style.display = 'none';
    }

    function checkUserInfo() {
        const name = getCookie("kiosk_username");
        const phone = getCookie("kiosk_phone");
        if (name && phone) { currentUser.name = name; currentUser.phone = phone; }
        else { document.getElementById('userInfoModal').style.display = 'flex'; }
    }

    function addToCart(n, p) { cart.push({name:n, price:p}); updateUI(); }
    function removeFromCart(i) { cart.splice(i, 1); updateUI(); }
    
    function updateUI() {
        const t = cart.reduce((s, i) => s + i.price, 0);
        document.getElementById('cart-count').innerText = `선택: ${cart.length}개`;
        document.getElementById('cart-total').innerText = `${t.toLocaleString()}원`;
        renderCartList();
    }

    function renderCartList() {
        const c = document.getElementById('cart-list-container');
        if (cart.length === 0) { c.style.display = 'none'; return; }
        c.style.display = 'block'; c.innerHTML = '';
        cart.forEach((it, idx) => {
            c.innerHTML += `<div class="cart-item-row"><span style="flex:1">${it.name}</span><span style="font-weight:bold;margin-right:10px">${it.price.toLocaleString()}원</span><button class="delete-btn" onclick="event.stopPropagation();removeFromCart(${idx})">삭제</button></div>`;
        });
    }

    function openModal() {
        if(!cart.length) return alert("메뉴를 선택해 주세요!");
        document.getElementById('order-details').innerHTML = cart.map(i => `• ${i.name}`).join('<br>');
        document.getElementById('orderModal').style.display = 'flex';
    }
    
    function closeModal() { document.getElementById('orderModal').style.display = 'none'; }
    
    function closeSuccessModal() { 
        stopPolling();
        document.getElementById('successModal').style.display = 'none'; 
    }

    // --- 주문 전송 ---
    async function sendToSheet() {
        const btn = document.getElementById('submit-btn');
        btn.innerText = "전송 중..."; btn.disabled = true;

        const orderSummary = cart.map(i => i.name).join(', ');
        const totalAmount = cart.reduce((sum, i) => sum + i.price, 0).toLocaleString() + "원";
        const newOrderId = generateOrderId();

        try {
            await fetch(GAS_URL, {
                method: 'POST', mode: 'no-cors',
                body: JSON.stringify({
                    orderId: newOrderId, username: currentUser.name, phone: currentUser.phone,
                    order: orderSummary, total: totalAmount
                })
            });

            setCookie("active_order_id", newOrderId, 2); 

            closeModal();
            cart = []; updateUI();
            
            showStatusPopup(newOrderId, null);
            startPolling(newOrderId); 

        } catch (e) {
            alert("전송 오류. 다시 시도해 주세요.");
            btn.innerText = "확인"; btn.disabled = false;
        }
    }

    // --- 5초 Polling ---
    function startPolling(orderId) {
        if (pollingInterval) clearInterval(pollingInterval);
        pollingInterval = setInterval(() => {
            checkOrderStatus(orderId);
            console.log("5초 자동 확인 중..."); 
        }, 5000);
    }

    function stopPolling() {
        if (pollingInterval) {
            clearInterval(pollingInterval);
            pollingInterval = null;
        }
    }

    async function checkOrderStatus(orderId) {
        try {
            const response = await fetch(`${GAS_URL}?orderId=${orderId}`);
            const data = await response.json();

            if (data.status === "found") {
                showStatusPopup(orderId, data.receptionNo);
            } else {
                setCookie("active_order_id", "", -1);
                stopPolling();
            }
        } catch (e) {
            console.error("상태 확인 실패", e);
        }
    }

    function showStatusPopup(orderId, receptionNo) {
        const modal = document.getElementById('successModal');
        const title = document.getElementById('statusTitle');
        const msg = document.getElementById('statusMsg');
        const rArea = document.getElementById('receptionArea');
        
        document.getElementById('displayOrderId').innerText = orderId;
        modal.style.display = 'flex';

        if (receptionNo && receptionNo.trim() !== "") {
            title.innerText = "🔔 주문 접수 완료!";
            rArea.style.display = 'block';
            document.getElementById('displayReceptionNo').innerText = receptionNo + "번";
            msg.innerHTML = "접수가 완료되었습니다.<br>메뉴가 준비될 때까지 기다려주세요.";
        } else {
            title.innerText = "⏳ 주문 대기중";
            rArea.style.display = 'none';
            msg.innerHTML = "주문이 전송되었습니다.<br>접수번호가 표출될 때까지 잠시만 기다려주세요.<br><span style='font-size:0.8rem; color:#999; font-weight:normal;'>(5초마다 자동으로 확인합니다)</span>";
        }
    }

    function generateOrderId() {
        const now = new Date();
        const y = now.getFullYear(); const m = String(now.getMonth()+1).padStart(2,'0');
        const d = String(now.getDate()).padStart(2,'0'); const h = String(now.getHours()).padStart(2,'0');
        const mi = String(now.getMinutes()).padStart(2,'0'); const s = String(now.getSeconds()).padStart(2,'0');
        const ms = String(now.getMilliseconds()).padStart(3,'0');
        const array = new Uint32Array(1); window.crypto.getRandomValues(array);
        const rnd = array[0].toString().slice(0,4).padEnd(4,'0');
        return `${y}${m}${d}${h}${mi}${s}${ms}${rnd}`;
    }

    function setCookie(n, v, h) {
        const d = new Date(); d.setTime(d.getTime() + (h*60*60*1000));
        document.cookie = `${n}=${encodeURIComponent(v)};expires=${d.toUTCString()};path=/`;
    }
    
    function getCookie(n) {
        const v = `; ${document.cookie}`; const p = v.split(`; ${n}=`);
        if (p.length === 2) return decodeURIComponent(p.pop().split(';').shift());
    }

    // ✨ [Modified] 접속 시 로직
    window.onload = async () => {
        // 로딩 화면 표시
        const loader = document.getElementById('loadingOverlay');
        loader.style.display = 'flex';

        // 1. 유저 정보 체크
        checkUserInfo();
        
        // 2. 주문번호 쿠키 체크
        const activeOrderId = getCookie("active_order_id");
        if (activeOrderId) {
            // 서버에 상태 확인 (await로 기다림)
            await checkOrderStatus(activeOrderId);
            // 확인 후 팝업이 떴다면 폴링 시작
            if (document.getElementById('successModal').style.display === 'flex') {
                startPolling(activeOrderId);
            }
        }

        // 모든 체크가 끝나면 로딩 화면 숨김
        loader.style.display = 'none';
    }
</script>
</body>
</html>
